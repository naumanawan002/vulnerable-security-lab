[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerable-security-lab"
version = "0.1.0"
description = "Vulnerable-by-design application demonstrating SQLi, SSRF, IDOR, XSS, and Path Traversal with documented fixes"
authors = [{ name = "Nauman", email = "nauman@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
